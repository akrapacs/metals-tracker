# Fetches prices with the METALS_API_KEY secret, stores them on the `data` branch, and deploys the
# static site to GitHub Pages with the prices file included. The browser never sees the API key.
name: Update prices and deploy to Pages

on:
  push:
    branches: ["main"]

  # Hourly (~550-600 metals.dev requests/month); update-prices.mjs skips scheduled runs while the market is closed
  schedule:
    - cron: "7 * * * *"

  workflow_dispatch:

permissions:
  contents: read

# One run at a time so updates to the data branch never race. Queued runs are replaced by the newest one,
# but an in-progress deployment is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check out data branch
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add --detach data-branch FETCH_HEAD
          else
            git worktree add --orphan -b data data-branch
          fi
      - name: Update prices
        id: update
        run: node scripts/update-prices.mjs
        env:
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
          DATA_FILE: data-branch/prices.json
          FORCE_UPDATE: ${{ github.event_name != 'schedule' }}
      - name: Save prices to data branch
        if: steps.update.outputs.updated == 'true'
        working-directory: data-branch
        # The file holds the full history, so the branch is replaced with a single commit each time instead of growing forever
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan next
          git add prices.json
          git commit --quiet -m "Update prices"
          git push --force origin HEAD:data

  build:
    needs: update
    # Code pushes still deploy (with the last saved prices) if the price update fails
    if: ${{ !cancelled() && (needs.update.outputs.updated == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add prices file
        run: |
          git fetch --depth=1 origin data
          mkdir -p public/data
          git show FETCH_HEAD:prices.json > public/data/prices.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npx --no-install next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
